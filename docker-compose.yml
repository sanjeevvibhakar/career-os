version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careeros-db
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: careeros-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careeros
      SPRING_DATASOURCE_USERNAME: careeros
      SPRING_DATASOURCE_PASSWORD: careeros
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: careeros-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
