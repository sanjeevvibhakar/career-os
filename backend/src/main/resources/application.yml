spring:
  application:
    name: career-os
  datasource:
    url: jdbc:postgresql://localhost:5432/careeros
    username: careeros
    password: careeros
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: career-os-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256
    expiration: 86400000
    refresh-expiration: 604800000

server:
  port: 8080
