spring:
  application:
    name: career-os
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careeros}
    username: ${SPRING_DATASOURCE_USERNAME:careeros}
    password: ${SPRING_DATASOURCE_PASSWORD:careeros}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:career-os-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256}
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://career-os.skvibhakar.workers.dev,https://*.pages.dev,https://*.vercel.app}

server:
  port: ${PORT:8080}
