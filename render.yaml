services:
  - type: web
    name: career-os-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://career-os.skvibhakar.workers.dev,https://*.pages.dev,https://*.vercel.app

databases:
  - name: careeros-db
    databaseName: careeros
    user: careeros
    plan: free
    region: oregon
